name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci --include=optional
        working-directory: apps/api

      - name: Lint
        run: npm run lint
        working-directory: apps/api

      # Runs without LibreOffice or Python installed, which is exactly the
      # point: the suite must pass on a runtime missing those engines, proving
      # the capability degradation works rather than crashing.
      - name: Test
        run: npm test
        working-directory: apps/api
        # Pinned empty so the suite can never pick up a real key and reach the
        # LLM provider. The AI tests mock the SDK; the rest must not need it.
        env:
          LLM_API_KEY: ''

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: codf-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches the failure mode that broke the previous deployment: an image
      # that builds fine but cannot actually perform its conversions.
      - name: Start container
        run: |
          docker run -d --name codf --memory=512m -p 3030:3030 \
            -e CLIENT_ORIGIN=https://example.vercel.app \
            codf-api:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3030/api/health -o /tmp/health.json; then
              echo "Healthy after ${attempt}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::API never became healthy"
          docker logs codf
          exit 1

      - name: Assert every conversion engine is present in the image
        run: |
          python3 - <<'PY'
          import json, sys

          with open('/tmp/health.json') as handle:
              capabilities = json.load(handle)['data']['capabilities']

          missing = [name for name, value in capabilities.items() if not value['available']]

          for name, value in capabilities.items():
              status = 'OK' if value['available'] else f"MISSING — {value['reason']}"
              print(f"{name}: {status}")

          if missing:
              print(f"::error::Image is missing engines: {', '.join(missing)}")
              sys.exit(1)
          PY

      - name: Convert code to PDF through the running container
        run: |
          curl -fsS -X POST http://127.0.0.1:3030/api/convert/code-to-pdf \
            -H 'Content-Type: application/json' \
            -d '{"filename":"ci_check","language":"python","code":"print(\"hello from ci\")\n"}' \
            -o /tmp/result.json
          cat /tmp/result.json
          NAME=$(python3 -c "import json;print(json.load(open('/tmp/result.json'))['data']['outputFileName'])")
          curl -fsS "http://127.0.0.1:3030/api/files/$NAME" -o /tmp/out.pdf
          head -c 4 /tmp/out.pdf | grep -q '%PDF' && echo "PDF verified"

      - name: Container logs
        if: always()
        run: docker logs codf

      - name: Stop container
        if: always()
        run: docker rm -f codf || true
